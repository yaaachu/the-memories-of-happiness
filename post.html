<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後記｜덕질 일기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="site-title" id="post-title"></h1>
  </header>

  <main class="post-wrapper">
    <div class="post-paper">
      <div class="meta" id="post-meta"></div>
      <article id="post-content"></article>
    </div>
  </main>

  <footer class="site-footer">
    <p><a href="index.html">← 回到首頁</a></p>
  </footer>

<script src="data.js"></script>
<script>
  // =====================
  // 後記頁資料讀取
  // =====================

  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');

  console.log("postId =", postId);

  const post = posts.find(p => p.id === postId);

  if (!post) {
    document.getElementById('post-title').textContent = '找不到這篇後記';
  } else {
    document.getElementById('post-title').textContent = post.title;
    document.getElementById('post-meta').textContent =
      `${post.date}｜${post.venue}`;

    // 依照 id 載入對應 html 檔
    fetch(`${post.id}.html`)
    .then(res => {
      if (!res.ok) throw new Error("HTML 檔案不存在或路徑錯誤");
      return res.text();
    })
    .then(html => {
      document.getElementById('post-content').innerHTML = html;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('post-content').textContent = '後記內容載入失敗';
    });
  }
</script>

</body>
</html>
