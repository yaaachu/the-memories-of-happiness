<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>후기｜덕질 일기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="site-title" id="post-title"></h1>
  </header>

<div class="post-page">
  <aside class="toc-column">
    <nav id="toc" class="post-toc">
      <p class="toc-title">目錄</p>
      <ul></ul>
    </nav>
  </aside>
  
  <main class="content-column">
    <div class="post-paper">
      <div class="meta" id="post-meta"></div>
      <article id="post-content" style="white-space:pre-line;margin-top:24px;"></article>
    </div>
  </main>
</div>
  
  <footer class="site-footer">
    <p><a href="index.html">← 回到首頁</a></p>
  </footer>

<script src="data.js"></script>
<script>
  // =====================
  // 後記頁資料讀取
  // =====================

  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');

  console.log("postId =", postId);

  const post = posts.find(p => p.id === postId);

  if (!post) {
    document.getElementById('post-title').textContent = '找不到這篇後記';
  } else {
    document.getElementById('post-title').textContent = post.title;
    document.getElementById('post-meta').textContent =
      `${post.date}｜${post.venue}`;

  // =====================
  // 後記內容載入
  // =====================
  fetch(`${post.id}.html`)
    .then(res => {
      if (!res.ok) throw new Error('HTML 檔案不存在');
      return res.text();
    })
    .then(html => {
      const content = document.getElementById('post-content');
      content.innerHTML = html;
      generateTOC();
    })
    .catch(() => {
      document.getElementById('post-content').textContent = '後記內容載入失敗';
    });

  // =====================
  // 產生目錄
  // =====================
  function generateTOC() {
    const tocWrapper = document.getElementById('toc');
    const tocList = tocWrapper.querySelector('ul');
    const headings = document.querySelectorAll('#post-content h3');

    if (!headings.length) {
      tocWrapper.style.display = 'none';
      return;
    }

    tocList.innerHTML = '';

    headings.forEach((h, index) => {
      const id = `section-${index}`;
      h.id = id;

      const li = document.createElement('li');
      const a = document.createElement('a');

      a.href = `#${id}`;
      a.textContent = h.dataset.toc || h.textContent;

      li.appendChild(a);
      tocList.appendChild(li);
    });
  }

</script>

</body>
</html>
