<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>후기｜덕질 일기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="site-title" id="post-title"></h1>
  </header>

<div class="post-page">
  <aside class="toc-column">
    <nav id="toc" class="post-toc">
      <p class="toc-title">目錄</p>
      <ul></ul>
    </nav>
  </aside>
  
  <main class="content-column">
    <div class="post-paper">
      <div class="meta" id="post-meta"></div>
      <article id="post-content" style="white-space:pre-line;margin-top:24px;"></article>
    </div>
  </main>
</div>
  
  <footer class="site-footer">
    <p><a href="index.html">← 回到首頁</a></p>
  </footer>
  
  <button id="back-to-top" title="回到頂端">↑</button>
  
<script src="data.js"></script>
<script>
  // =====================
  // 後記頁資料讀取
  // =====================

  const backToTop = document.getElementById('back-to-top');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 320) {
      backToTop.style.display = 'block';
    } else {
      backToTop.style.display = 'none';
    }
  });
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');

  console.log("postId =", postId);

  const post = posts.find(p => p.id === postId);

  if (!post) {
    document.getElementById('post-title').textContent = '找不到這篇後記';
  } else {
    document.getElementById('post-title').textContent = post.title;
    const metaEl = document.getElementById('post-meta');

    metaEl.innerHTML = `
      ${post.date} ｜ 
      ${post.venue}
      ${post.fellow ? `<span class="fellow">${post.fellow}</span>` : ''}
    `;

  // =====================
  // 後記內容載入
  // =====================
  fetch(`${post.id}.html`)
    .then(res => {
      if (!res.ok) throw new Error('HTML 檔案不存在');
      return res.text();
    })
    .then(html => {
      const content = document.getElementById('post-content');
      content.innerHTML = html;
      generateTOC();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('post-content').textContent = '後記內容載入失敗';
    });
  }
  // =====================
  // 產生目錄
  // =====================
  function generateTOC() {
    const tocWrapper = document.getElementById('toc');
    const tocList = tocWrapper.querySelector('ul');
    const headings = document.querySelectorAll('#post-content h3, #post-content h4');

    if (!headings.length) {
      tocWrapper.style.display = 'none';
      return;
    }

    tocList.innerHTML = '';

    let subList = null;

    headings.forEach((h, index) => {
      const id = `section-${index}`;
      h.id = id;

      const text = h.dataset.toc || h.textContent;
      
      if (h.tagName === 'H3') {
        const li = document.createElement('li');
        // ===== 包一層容器（箭頭 + 文字）=====
        const row = document.createElement('div');
        row.className = 'toc-row';

        // ===== 文字（負責跳轉）=====
        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = text;

        // ===== 箭頭（先不一定加）=====
        const arrow = document.createElement('span');
        arrow.className = 'toc-arrow';
        arrow.textContent = '▶';
        arrow.style.visibility = 'hidden';

        row.appendChild(arrow);
        row.appendChild(link);

        li.appendChild(row);

        // 建立子目錄容器
        subList = document.createElement('ul');
        subList.className = 'toc-sublist collapsed';

        li.appendChild(subList);
        tocList.appendChild(li);

        currentLi = li;

        // 👉 點箭頭才展開
        arrow.addEventListener('click', (e) => {
          e.stopPropagation();

          const isCollapsed = subList.classList.contains('collapsed');

          // 🔥 關閉全部
          document.querySelectorAll('.toc-sublist').forEach(ul => {
            ul.classList.add('collapsed');
          });
          document.querySelectorAll('.toc-arrow').forEach(a => {
            a.textContent = '▶';
          });

          // 🔥 開當前
          if (isCollapsed) {
            subList.classList.remove('collapsed');
            arrow.textContent = '▼';
          }
        });

      } else if (h.tagName === 'H4' && subList) {
        const li = document.createElement('li');
        li.className = 'toc-sub';

        const a = document.createElement('a');
        a.href = `#${id}`;
        a.textContent = text;

        li.appendChild(a);
        subList.appendChild(li);

        // 👉 有 h4 才顯示箭頭
        if (currentLi) {
          currentLi.querySelector('.toc-arrow').style.visibility = 'visible';
        }
      }
    });
 }

</script>

</body>
</html>
