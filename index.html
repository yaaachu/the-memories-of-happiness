<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>덕질 일기</title>
  <meta name="description" content="덕질 일기 — 演唱會後記回憶網站" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 密碼保護遮罩 -->
<div id="lock" style="position:fixed;inset:0;background:#f6f6f6;display:flex;align-items:center;justify-content:center;z-index:9999;">
<div style="background:#fff;padding:24px 28px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.1);max-width:360px;width:90%;">
<h2 style="margin-top:0;">輸入密碼</h2>
<input id="pwd" type="password" placeholder="請輸入密碼以查看內容" style="width:100%;padding:10px;font-size:1em;margin:10px 0;" />
<button id="unlock" style="width:100%;padding:10px;font-size:1em;">確定</button>
<p id="pwd-error" style="color:#c00;display:none;margin-top:10px;">密碼錯誤</p>
</div>
</div>

  <!-- 🏠 主頁內容 -->
  <header class="site-header">
    <h1 class="site-title">덕질 일기</h1>
  </header>

  <div class="main-container">
    <!-- 左側年份目錄 -->
    <aside id="year-menu" class="year-menu"></aside>

    <!-- 右側卡片主區 -->
    <main id="app" class="card-grid">
    <!-- 演唱會卡片由 JavaScript 動態產生 -->
    </main>
  </div>
  
  <footer class="site-footer">
    <p>© 덕질 일기</p>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>

  <script>
  // =====================
  // 🔐 簡易密碼保護（前端）
  // =====================
  const SITE_PASSWORD = '170530'; // ⚠️ 前端密碼僅為簡易保護
  const lock = document.getElementById('lock');
  const pwdInput = document.getElementById('pwd');
  const unlockBtn = document.getElementById('unlock');
  const pwdError = document.getElementById('pwd-error');

  function tryUnlock() {
    if (pwdInput.value === SITE_PASSWORD) {
      // 不再記錄解鎖狀態，每次重新整理都需要重新輸入
      lock.style.display = 'none';
      pwdError.style.display = 'none';
    } else {
      pwdError.style.display = 'block';
    }
  }

  // 每次重新整理都重新上鎖，不自動解鎖

  unlockBtn.addEventListener('click', tryUnlock);
  pwdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  </script>

</body>
</html>
